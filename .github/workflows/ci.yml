name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Source-only checkout: uv sync installs third-party dependencies only.
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv pip check
      - run: uv run --no-sync python -m pytest -q
      - run: uv run --no-sync python -m unittest discover -s vendor/brainco_standalone/tests -v
      - run: uv run --no-sync python main.py --validate
      - run: uv run --no-sync python -m src --validate
      - run: uv run --no-sync python main.py --fast
